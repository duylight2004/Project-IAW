<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antiqua Library</title>
  <meta name="description" content="Archive of ancient volumes - search, auctions and rare book collecting" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Antiqua Library</h1>
      <p class="subtitle">Archive of rare volumes &mdash; search, auction, collect.</p>
      <nav class="nav">
        <a href="/login">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Login
        </a>
        <a href="/shop">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Shop
        </a>
        <a href="/auction">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Auctions
        </a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="search-section">
      <p class="label">Enter a volume title to search the archive</p>
      <div class="search-box">
        <input id="q" placeholder="e.g. Star Map" autocomplete="off" />
        <button onclick="doSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Search
        </button>
      </div>

      <div class="ornament">&loz; &bull; &loz;</div>

      <div class="results-panel">
        <pre id="out">// search results appear here</pre>
      </div>
    </div>
  </main>

  <footer class="footer">
    Antiqua Library &copy; 2025 &mdash; Archive of ancient volumes
  </footer>

  <script src="/static/js/modal.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
