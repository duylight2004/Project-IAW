<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antiqua Library - Kho Thư Tịch Cổ</title>
  <meta name="description" content="Kho luu tru thu tich co - tra cuu, dau gia va suu tam sach hiem" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Thư viện hiệu ứng chuyển động -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
  <!-- Background Banner Hero hoành tráng -->
  <div class="hero-banner animate__animated animate__fadeIn">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-logo animate__animated animate__zoomIn">
        <i data-lucide="library" class="library-logo"></i>
      </div>
      <h1 class="animate__animated animate__fadeInDown">ANTIQUA LIBRARY</h1>
      <p class="subtitle animate__animated animate__fadeInUp">Kho thư tịch hiếm &mdash; tra cứu, đấu giá, sưu tầm.</p>
    </div>
  </div>

  <header class="header">
    <div class="header-inner">
      <nav class="nav">
        <a href="/">
          <i data-lucide="home"></i> Trang chủ
        </a>
        <a href="/shop">
          <i data-lucide="book-open"></i> Kho sách
        </a>
        <a href="/auction">
          <i data-lucide="gavel"></i> Đấu giá
        </a>
        <a href="/login">
          <i data-lucide="log-in"></i> Đăng nhập
        </a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="search-section animate__animated animate__fadeInUp">
      <p class="label"><i data-lucide="scroll" class="section-icon"></i> Nhập tên thư tịch để tra cứu trong kho lưu trữ</p>
      
      <div class="search-box" data-tilt data-tilt-max="3" data-tilt-scale="1.01">
        <input id="q" placeholder="Ví dụ: Ban Do Sao" autocomplete="off" />
        <button onclick="doSearch()">
          <i data-lucide="search"></i>
          Tra cứu
        </button>
      </div>

      <div class="ornament animate__animated animate__fadeIn animate__delay-1s">&loz; &bull; &loz;</div>

      <div class="results-panel animate__animated animate__fadeInUp animate__delay-1s">
        <div class="results-header">
          <i data-lucide="terminal" class="terminal-icon"></i>
          <span>BẢNG KẾT QUẢ TRUY VẤN</span>
        </div>
        <pre id="out">// Kết quả tra cứu sẽ hiển thị ở đây...</pre>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>Antiqua Library &copy; 2025 &mdash; Dự án CTF Giáo Dục DBS</p>
      <div class="footer-ornament">&bull; &bull; &bull;</div>
    </div>
  </footer>

  <!-- Thư viện bổ trợ CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="/static/js/modal.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    // Khởi tạo Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
